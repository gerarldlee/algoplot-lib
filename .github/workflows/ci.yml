name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a broken deploy be re-run from the Actions tab after a settings change
  # without an empty commit (unauthenticated pushes are the only other trigger).
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The docs build is part of the gate: it executes every ```algoplot fence in
      # the guides (including Python, through npm pyodide) and TypeDoc type-checks
      # the public surface a second time.
      - run: npm run docs:build
      # The published surface: pack every workspace, install the tarballs into a
      # clean project, and run the same checks a consumer would (executeRun, the
      # remark plugin both modes, SSR, element node-safety, npm pyodide).
      - run: node tools/smoke.mjs

  deploy-docs:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Project pages live under /<repo>/, and every internal link goes through
      # import.meta.env.BASE_URL or stays relative — DOCS_BASE is what tells Astro
      # to emit that prefix.
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - uses: actions/deploy-pages@v4
